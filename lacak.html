<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Lacak Panggilan — Bengkel Mobil 24 Jam</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg: #0A0D0C;
    --bg-alt: #0F1A17;
    --panel: #152420;
    --panel-deep: #060907;
    --text: #EFF5F1;
    --text-dim: rgba(239,245,241,0.62);
    --amber: #FF8A1E;
    --amber-deep: #D96C00;
    --amber-soft: rgba(255,138,30,0.14);
    --lime: #C6FF3D;
    --line: rgba(239,245,241,0.10);
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; padding:20px 16px 40px;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,.display{font-family:'Big Shoulders Display',sans-serif; font-weight:800; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:480px; margin:0 auto;}

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .brand .mark{width:32px; height:32px; border-radius:9px; background:var(--amber); display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display'; font-weight:800; color:var(--panel-deep); font-size:15px;}
  .brand .name{font-family:'Big Shoulders Display'; font-weight:800; font-size:16px;}

  .stage-card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:26px 22px; text-align:center; position:relative; overflow:hidden; margin-bottom:18px;
  }
  .stage-icon{font-size:38px; margin-bottom:10px; display:inline-block;}
  .stage-icon.pulse{animation:iconPulse 1.6s ease-in-out infinite;}
  @keyframes iconPulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.12); opacity:0.75;}}
  .stage-title{font-size:20px; margin-bottom:6px;}
  .stage-sub{font-size:13.5px; color:var(--text-dim); line-height:1.5;}

  .stepper{display:flex; align-items:center; gap:6px; margin:20px auto 0; max-width:320px;}
  .stepper .seg{flex:1; height:5px; border-radius:4px; background:var(--line); position:relative; overflow:hidden;}
  .stepper .seg.done{background:var(--amber);}
  .stepper .seg.active::after{
    content:''; position:absolute; inset:0; background:var(--lime);
    animation:segLoad 1.4s ease-in-out infinite;
  }
  @keyframes segLoad{0%{transform:translateX(-100%);} 100%{transform:translateX(100%);}}
  .step-labels{display:flex; justify-content:space-between; max-width:320px; margin:8px auto 0; font-size:10.5px; font-family:'JetBrains Mono'; color:var(--text-dim); letter-spacing:0.02em;}

  .montir-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; display:none; align-items:center; gap:14px; margin-bottom:18px;
  }
  .montir-card.show{display:flex;}
  .montir-avatar{
    width:46px; height:46px; border-radius:50%; background:var(--amber-soft); color:var(--amber);
    display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display'; font-weight:800; font-size:18px; flex-shrink:0;
  }
  .montir-info{flex:1; min-width:0;}
  .montir-info .nm{font-weight:700; font-size:15px;}
  .montir-info .lb{font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono';}
  .montir-actions{display:flex; gap:8px;}
  .montir-actions a{
    width:38px; height:38px; border-radius:10px; background:var(--panel-deep); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; text-decoration:none; color:var(--text);
  }

  .detail-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:18px;
  }
  .detail-card .dt{font-family:'JetBrains Mono'; font-size:10.5px; color:var(--text-dim); letter-spacing:0.06em; margin-bottom:14px;}
  .detail-row{display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .detail-row:first-of-type{border-top:none;}
  .detail-row .ic{width:20px; flex-shrink:0;}
  .detail-row .lbl{color:var(--text-dim); width:88px; flex-shrink:0;}
  .detail-row .val{flex:1;}

  .back-link{
    display:block; text-align:center; margin-top:8px; color:var(--text-dim); font-size:13px;
    text-decoration:none; font-family:'JetBrains Mono';
  }

  .not-found{text-align:center; padding:60px 20px; color:var(--text-dim);}

  .map-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; margin-bottom:18px; display:none;
  }
  .map-card.show{display:block;}
  #map{width:100%; height:220px; background:var(--panel-deep);}
  .map-eta{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    font-family:'JetBrains Mono'; font-size:12px; color:var(--text-dim); border-top:1px solid var(--line);
  }
  .map-eta b{color:var(--lime); font-weight:600;}

  .leaflet-marker-icon.montir-pin{
    background:var(--amber); border:3px solid var(--panel-deep); border-radius:50%;
    width:26px !important; height:26px !important; display:flex; align-items:center; justify-content:center;
    font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .leaflet-marker-icon.cust-pin{
    background:var(--lime); border:3px solid var(--panel-deep); border-radius:50%;
    width:22px !important; height:22px !important; display:flex; align-items:center; justify-content:center;
    font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><div class="mark">24</div><div class="name">Bengkel Mobil 24 Jam</div></div>

  <div id="content">
    <div class="not-found">Memuat data panggilan...</div>
  </div>

  <div class="map-card" id="mapCard">
    <div id="map"></div>
    <div class="map-eta" id="mapEta">📡 Menunggu update lokasi montir...</div>
  </div>

  <a class="back-link" href="index.html">← Kembali ke beranda</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB838cDBYT3zgR278Ju0p7y6XqIOkXjAXM",
    authDomain: "buat-bengkel.firebaseapp.com",
    databaseURL: "https://buat-bengkel-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "buat-bengkel",
    storageBucket: "buat-bengkel.firebasestorage.app",
    messagingSenderId: "246842207726",
    appId: "1:246842207726:web:962cd601711df74f1172ff"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const contentEl = document.getElementById('content');

  if(!orderId){
    contentEl.innerHTML = '<div class="not-found">Link tidak valid.<br>Silakan buat panggilan baru dari beranda.</div>';
  } else {
    db.ref('panggilan/' + orderId).on('value', (snap) => {
      const order = snap.val();
      if(!order){
        contentEl.innerHTML = '<div class="not-found">Data panggilan tidak ditemukan atau sudah dihapus.</div>';
        return;
      }
      render(order);
    });
  }

  function render(order){
    const status = order.status || 'pending';
    const step = order.step || 0;
    const waNum = (order.montirHp || '').replace(/[^0-9]/g,'').replace(/^0/,'62');

    let stageIcon = '🔍', stageTitle = 'Mencari montir terdekat...', stageSub = 'Mohon tunggu, kami sedang mencocokkan Anda dengan montir yang tersedia di area Anda.', pulseClass = 'pulse';
    let effectiveStep = 0;

    if(status === 'diterima' && step === 1){
      stageIcon = '🚗'; stageTitle = 'Montir menuju lokasi Anda'; stageSub = 'Montir sudah menerima panggilan dan sedang dalam perjalanan.'; pulseClass='pulse'; effectiveStep = 1;
    } else if(status === 'diterima' && step === 2){
      stageIcon = '📍'; stageTitle = 'Montir telah sampai'; stageSub = 'Montir sudah berada di lokasi Anda dan mulai memeriksa kendaraan.'; pulseClass=''; effectiveStep = 2;
    } else if(status === 'selesai'){
      stageIcon = '✅'; stageTitle = 'Servis selesai'; stageSub = 'Terima kasih telah menggunakan Bengkel Mobil 24 Jam. Semoga perjalanan Anda lancar kembali.'; pulseClass=''; effectiveStep = 3;
    }

    const segClass = (idx) => {
      if(effectiveStep > idx) return 'seg done';
      if(effectiveStep === idx && status !== 'selesai') return 'seg active';
      if(status === 'selesai') return 'seg done';
      return 'seg';
    };

    const montirBlock = (status === 'diterima' || status === 'selesai') && order.montir ? `
      <div class="montir-card show">
        <div class="montir-avatar">${escapeHtml((order.montir||'M').charAt(0).toUpperCase())}</div>
        <div class="montir-info">
          <div class="nm">${escapeHtml(order.montir)}</div>
          <div class="lb">MONTIR ANDA</div>
        </div>
        ${status !== 'selesai' ? `
        <div class="montir-actions">
          <a href="tel:${escapeHtml(order.montirHp||'')}">📞</a>
          <a href="https://wa.me/${waNum}" target="_blank">💬</a>
        </div>` : ''}
      </div>
    ` : '';

    contentEl.innerHTML = `
      <div class="stage-card">
        <span class="stage-icon ${pulseClass}">${stageIcon}</span>
        <div class="stage-title">${stageTitle}</div>
        <div class="stage-sub">${stageSub}</div>
        <div class="stepper">
          <div class="${segClass(0)}"></div>
          <div class="${segClass(1)}"></div>
          <div class="${segClass(2)}"></div>
        </div>
        <div class="step-labels"><span>DITERIMA</span><span>DI LOKASI</span><span>SELESAI</span></div>
      </div>

      ${montirBlock}

      <div class="detail-card">
        <div class="dt">DETAIL PANGGILAN</div>
        <div class="detail-row"><span class="ic">👤</span><span class="lbl">Nama</span><span class="val">${escapeHtml(order.nama||'-')}</span></div>
        <div class="detail-row"><span class="ic">🚙</span><span class="lbl">Kendaraan</span><span class="val">${escapeHtml(order.mobil||'-')}</span></div>
        <div class="detail-row"><span class="ic">🛠️</span><span class="lbl">Layanan</span><span class="val">${escapeHtml(order.layanan||'-')}</span></div>
        <div class="detail-row"><span class="ic">📍</span><span class="lbl">Lokasi</span><span class="val">${escapeHtml(order.lokasi||'-')}</span></div>
        ${order.keluhan ? `<div class="detail-row"><span class="ic">📝</span><span class="lbl">Keluhan</span><span class="val">${escapeHtml(order.keluhan)}</span></div>` : ''}
      </div>
    `;

    updateMap(order, status);
  }

  /* ---------- Peta live (Leaflet + OpenStreetMap, gratis tanpa API key) ---------- */
  let map = null, montirMarker = null, custMarker = null;
  const mapCard = document.getElementById('mapCard');
  const mapEta = document.getElementById('mapEta');

  function ensureMap(){
    if(map) return;
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-6.2, 106.8], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);
  }

  function distanceKm(lat1, lng1, lat2, lng2){
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function updateMap(order, status){
    const hasMontir = typeof order.montirLat === 'number' && typeof order.montirLng === 'number';
    const hasCust = typeof order.lokasiLat === 'number' && typeof order.lokasiLng === 'number';

    if(status === 'selesai' || (!hasMontir && !hasCust)){
      mapCard.classList.remove('show');
      return;
    }

    mapCard.classList.add('show');
    ensureMap();
    setTimeout(()=>map.invalidateSize(), 50);

    const montirIcon = L.divIcon({ className: 'montir-pin', html: '🔧', iconSize: [26,26] });
    const custIcon = L.divIcon({ className: 'cust-pin', html: '📍', iconSize: [22,22] });

    const points = [];

    if(hasMontir){
      const pos = [order.montirLat, order.montirLng];
      if(!montirMarker){ montirMarker = L.marker(pos, { icon: montirIcon }).addTo(map); }
      else { montirMarker.setLatLng(pos); }
      points.push(pos);
    }
    if(hasCust){
      const pos = [order.lokasiLat, order.lokasiLng];
      if(!custMarker){ custMarker = L.marker(pos, { icon: custIcon }).addTo(map); }
      else { custMarker.setLatLng(pos); }
      points.push(pos);
    }

    if(points.length === 2){
      map.fitBounds(points, { padding: [30,30] });
      const km = distanceKm(order.montirLat, order.montirLng, order.lokasiLat, order.lokasiLng);
      const menit = Math.max(1, Math.round((km / 30) * 60));
      mapEta.innerHTML = `🔧 Jarak montir: <b>${km.toFixed(1)} km</b> — estimasi <b>~${menit} menit</b>`;
    } else if(points.length === 1){
      map.setView(points[0], 15);
      mapEta.textContent = hasMontir ? '📡 Menunggu lokasi Anda...' : '📡 Menunggu montir mulai berbagi lokasi...';
    }
  }
</script>

</body>
</html>
